<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, target-densitydpi=medium-dpi, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>대국민</title>

<link type="text/css" rel="stylesheet" href="../css/jquery-ui.css">

<script src="../script/jquery-3.7.1.min.js"></script>
<script src="../script/jquery-ui.js"></script>

<script type="text/javascript" src="../../SBGrid3/license.js"></script>

<link rel="stylesheet" href="../../SBGrid3/css/sbgrid3.css">

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>	
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script>
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                document.querySelector('.wrap').insertAdjacentHTML('afterbegin', data);
                drowmDown();
            }});
        </script>
                
        <div class="container" id="content">
            <script>
                $.ajax({url:"common/lnb.txt", dataType:"text", success:function(data){
                    document.querySelector('.container').insertAdjacentHTML('afterbegin', data);
                    lnbMenu();
                }});
            </script>
            <div class="contents">
                <ol class="breadcrumb">
                    <li><a href="/" aria-label="홈으로 이동"><i class="ico-home"></i><span>홈</span></a></li>
                    <li><a href="javascript:;"><span>1DEPTH</span></a></li>
                    <li><a href="javascript:;"><span>2DEPTH</span></a></li>
                    <li><a href="javascript:"><span>CURRENT</span></a></li>
                </ol>
                <div class="title-main-wrap">
                    <h2 class="title-main">보유시험 자료</h2>
                </div>

                <div class="search-box">
                    <div class="sc-block">
                        <div class="sc-row">
                            <select class="sc-sel" aria-label="검색 구분">
                                <option>전체</option>
                                <option>제목</option>
                                <option>내용</option>
                            </select>
                            <div class="input-search-wrap">
                                <div class="input-search inp-del">
                                    <input type="text" placeholder="검색어를 입력해주세요." aria-label="검색어">
                                </div>
                                <button type="button" class="btn-search">
                                    <span>검색</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="data-util">
                    <div class="left">
                        <div class="total">검색 결과 <em>124</em>개</div>
                    </div>
                    <div class="right">
                        <select name="pageSize" id="pageSize" class="no-line xsm" aria-label="페이지당 표시 개수">
                            <option value="10">10개</option>
                            <option value="20">20개</option>
                            <option value="30">30개</option>
                        </select>
                    </div>
                </div>

                <div class="data-table">
                    <div id="grid" aria-label="일반등록 전체목록"></div>
                </div>

                
                
            </div>
        </div>
        <script>
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                document.querySelector('.wrap').insertAdjacentHTML('beforeend', data);
                footerSite();
            }});
        </script>
    </div>
