<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="format-detection" content="telephone=no"/>
<title>대국민</title>

<link type="text/css" rel="stylesheet" href="../css/jquery-ui.css">

<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup">
      <div class="pop-header">
        <h2 class="title">UN No 정보</h2>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"></i></button>
        </div>
      </div>
      <div class="pop-body">
        <div class="data-default">
            <table>
                <caption class="sr-only">UN No 정보 — UN No, 명칭 및 설명</caption>
                <colgroup>
                    <col style="width:20%;min-width: 4.8125rem;">
                    <col style="width:auto;">
                </colgroup>
                <thead>
                    <tr>
                        <th scope="col">UN No</th>
                        <th scope="col">명칭 및 설명</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>3077</td>
                        <td class="align-l">ENVIRONMENTALLY HAZARDOUS SUBSTANCE, SOLID, N.O.S.</td>
                    </tr>
                    <tr>
                        <td>3082</td>
                        <td class="align-l">ENVIRONMENTALLY HAZARDOUS SUBSTANCE, SOLID, N.O.S.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="txt-exp-wrap">
            <p class="txt-exp">※ UN No. 부여방법 및 자세한 사항은 <a href="https://www.unece.org" target="_blank" class="link" >www.unece.org<span class="sr-only">(새 창)</span></a>에서 참고하시기 바랍니다.</p>
        </div>

      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');
</script>  

</body>
</html>
