<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, target-densitydpi=medium-dpi, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>대국민</title>

<link type="text/css" rel="stylesheet" href="../css/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../script/jquery-3.7.1.min.js"></script>
<script src="../script/jquery-ui.js"></script>
<script src="../script/pub-ui.js"></script>

<script type="text/javascript" src="../../SBGrid3/license.js"></script>
<script type="text/javascript" src="../../SBGrid3/sbgrid3.js"></script>
<link rel="stylesheet" href="../../SBGrid3/css/sbgrid3.css">
<link rel="stylesheet" href="../../SBGrid3/css/admin_sbgrid.css">

<link type="text/css" rel="stylesheet" href="../script/swiper10.3.1/swiper-bundle.min.css">
<script src="../script/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../script/jquery-swiper.js"></script>

<script src="../script/zoom/zoomsl.js"></script>
</head>
<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup" style="width: 1182px;;">
      <div class="pop-header">
        <h2 class="title">라벨인쇄</h2>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"></i></button>
        </div>
      </div>
      <div class="pop-body">
        <div class="tag-set-wrap">
            <div class="tag-set">
                <span class="tag">CAS No</span>
                <span class="val">11118-57-3</span>
            </div>
        </div>

        <div class="title-article-wrap">
            <h3 class="title-article">크로뮴산화물(Chromium oxide)</h3>
        </div>

        <div class="title-section-wrap">
            <h3 class="title-section">용기·포장의 용량</h3>
            <div class="right">
                <select class="no-line xsm">
                    <option>Korean</option>
                    <option>English</option>
                </select>
                <button type="button" class="btn-xsm btn-white" aria-label="인쇄">
                    <span class="mo-hide">인쇄</span>
                    <svg class="ico-print" aria-hidden="true" focusable="false"><use href="../images/common/simbol.svg#ico-print"></use></svg>
                </button>
            </div>
        </div>

          <ul class="vessel-select" role="radiogroup">
              <li>
                  <label class="vessel-item on">
                      <span class="vs-head">
                          <input type="radio" name="vessel-size" value="under-5" checked>
                          <span class="vs-title">5ℓ미만</span>
                      </span>
                      <span class="vs-desc">(용기·내부 포장의 상하면적을 제외한 전체 표면적의 5%이상)</span>
                      <span class="vs-img">
                          <img src="../images/temp/@vessel.png" alt="">
                      </span>
                      <span class="vs-note">소형용기(100ml), 원형 캔(4ℓ) 등에 사용합니다.</span>
                  </label>
              </li>
              <li>
                  <label class="vessel-item">
                      <span class="vs-head">
                          <input type="radio" name="vessel-size" value="under-5b">
                          <span class="vs-title">5ℓ미만</span>
                      </span>
                      <span class="vs-desc">(용기·내부 포장의 상하면적을 제외한 전체 표면적의 5%이상)</span>
                      <span class="vs-img">
                          <img src="../images/temp/@vessel.png" alt="">
                      </span>
                      <span class="vs-note">소형용기(100ml), 원형 캔(4ℓ) 등에 사용합니다.</span>
                  </label>
              </li>
              <li>
                  <label class="vessel-item disabled">
                      <span class="vs-head">
                          <input type="radio" name="vessel-size" value="under-5c" disabled>
                          <span class="vs-title">5ℓ미만</span>
                      </span>
                      <span class="vs-desc">(용기·내부 포장의 상하면적을 제외한 전체 표면적의 5%이상)</span>
                      <span class="vs-img">
                          <img src="../images/temp/@vessel.png" alt="">
                      </span>
                      <span class="vs-note">소형용기(100ml), 원형 캔(4ℓ) 등에 사용합니다.</span>
                  </label>
              </li>
              <li>
                  <label class="vessel-item">
                      <span class="vs-head">
                          <input type="radio" name="vessel-size" value="under-5d">
                          <span class="vs-title">5ℓ미만</span>
                      </span>
                      <span class="vs-desc">(용기·내부 포장의 상하면적을 제외한 전체 표면적의 5%이상)</span>
                      <span class="vs-img">
                          <img src="../images/temp/@vessel.png" alt="">
                      </span>
                      <span class="vs-note">소형용기(100ml), 원형 캔(4ℓ) 등에 사용합니다.</span>
                  </label>
              </li>
              <li>
                  <label class="vessel-item">
                      <span class="vs-head">
                          <input type="radio" name="vessel-size" value="under-5e">
                          <span class="vs-title">5ℓ미만</span>
                      </span>
                      <span class="vs-desc">(용기·내부 포장의 상하면적을 제외한 전체 표면적의 5%이상)</span>
                      <span class="vs-img">
                          <img src="../images/temp/@vessel.png" alt="">
                      </span>
                      <span class="vs-note">소형용기(100ml), 원형 캔(4ℓ) 등에 사용합니다.</span>
                  </label>
              </li>
          </ul>       
          

          <div class="title-section-wrap">
              <h3 class="title-section">물질명</h3>
          </div>    
          <p>크로뮴산화물(Chromium oxide)</p>      
          

          <div class="title-section-wrap">
              <h3 class="title-section"><label for="lbl-supplier">공급업체</label></h3>
          </div>
          <input type="text" id="lbl-supplier" name="supplier" placeholder="공급업체를 입력해주세요." style="width: 100%;">


          <div class="title-section-wrap">
              <h3 class="title-section">예방조치문구를 포함한 라벨 항목</h3>
          </div>     
          <div class="group-item-list">
            <section class="group-item">
                <h4 class="group-item-title">1. 그림문자(Pictogram)</h4>
                <ul class="pictogram-list">
                    <li><img src="../images/temp/@pictogram.jpg" alt=""></li>
                    <li><img src="../images/temp/@pictogram.jpg" alt=""></li>
                    <li><img src="../images/temp/@pictogram.jpg" alt=""></li>
                </ul>
            </section>

            <section class="group-item">
                <h4 class="group-item-title">2. 신호어(Signal Word)</h4>
                <p class="group-item-text">위험</p>
            </section>

            <section class="group-item">
                <h4 class="group-item-title">3. 유해 위험문구(Hazard Statement)</h4>
                <ul class="group-item-list">
                    <li>
                        <div class="input-choice">
                            <input id="hs-h225" type="checkbox" checked>
                            <label for="hs-h225">H225 : 고인화성 액체 및 증기</label>
                        </div>
                    </li>
                    <li>
                        <div class="input-choice">
                            <input id="hs-h301" type="checkbox">
                            <label for="hs-h301">H301 : 삼키면 유독함</label>
                        </div>
                    </li>
                    <li>
                        <div class="input-choice">
                            <input id="hs-h317" type="checkbox">
                            <label for="hs-h317">H317 : 알레르기성 피부 반응을 일으킬 수 있음</label>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="group-item">
                <h4 class="group-item-title">4. 예방조치문구(Precautionary Statement)</h4>

                <div class="group-item-sub">
                    <h5 class="group-item-sub-title">* 예방(Prevention)</h5>
                    <ul class="group-item-list">
                        <li>
                            <div class="input-choice">
                                <input id="ps-p201" type="checkbox" checked>
                                <label for="ps-p201">P201 : 사용 전 취급 설명서를 확보하시오.</label>
                            </div>
                        </li>
                        <li>
                            <div class="input-choice">
                                <input id="ps-p202" type="checkbox">
                                <label for="ps-p202">P202 : 모든 안전 예방조치 문구를 읽고 이해하기 전에는 취급하지 마시오.</label>
                            </div>
                        </li>
                        <li>
                            <div class="input-choice">
                                <input id="ps-p264" type="checkbox">
                                <label for="ps-p264">P264 : 취급 후에는 …을(를) 철저히 씻으시오.</label>
                            </div>
                        </li>
                    </ul>
                    <label for="ps-prev-input" class="sr-only">예방 항목 추가 입력</label>
                    <input type="text" id="ps-prev-input" class="group-item-input" placeholder="입력해주세요.">
                </div>

                <div class="group-item-sub">
                    <h5 class="group-item-sub-title">* 대응(Response)</h5>
                    <ul class="group-item-list">
                        <li>
                            <div class="input-choice">
                                <input id="ps-p270" type="checkbox" checked>
                                <label for="ps-p270">P270 : 이 제품을 사용할 때에는 먹거나, 마시거나 흡연하지 마시오.</label>
                            </div>
                        </li>
                        <li>
                            <div class="input-choice">
                                <input id="ps-p273" type="checkbox">
                                <label for="ps-p273">P273 : .., 처치를 하시오.</label>
                            </div>
                        </li>
                    </ul>
                    <label for="ps-resp-input" class="sr-only">대응 항목 추가 입력</label>
                    <input type="text" id="ps-resp-input" class="group-item-input" placeholder="입력해주세요.">
                </div>
            </section>
        </div>         
      </div>
      <div class="pop-footer">
        <div class="btn-wrap">
            <button type="button" class="btn-lg btn-white" onclick="popClose('#tempPopId')">취소</button>
            <button type="button" class="btn-lg btn-blue">확인</button>
        </div>
      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');
</script>  

</body>
</html>
