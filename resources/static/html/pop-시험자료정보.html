<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, target-densitydpi=medium-dpi, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>대국민</title>

<link type="text/css" rel="stylesheet" href="../css/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../script/jquery-3.7.1.min.js"></script>
<script src="../script/jquery-ui.js"></script>
<script src="../script/pub-ui.js"></script>

<script type="text/javascript" src="../../SBGrid3/license.js"></script>
<script type="text/javascript" src="../../SBGrid3/sbgrid3.js"></script>
<link rel="stylesheet" href="../../SBGrid3/css/sbgrid3.css">
<link rel="stylesheet" href="../../SBGrid3/css/admin_sbgrid.css">
</head>
<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup">
      <div class="pop-header">
        <h2 class="title">시험자료정보</h2>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"></i></button>
        </div>
      </div>
      <div class="pop-body">
        <div class="tag-set-wrap">
            <div class="tag-set">
                <span class="tag">CAS No</span>
                <span class="val">11118-57-3</span>
            </div>
        </div>

        <div class="title-article-wrap">
            <h3 class="title-article">(1-하이드록시사이클로헥실)페닐메타논, (1-Hydroxycyclohexyl)phenylmethanone</h3>
        </div>

        <div class="data-detail">
            <table>
                <caption class="sr-only">시험자료 상세 — 시험명, 생산연도, GLP여부, 국/영문, 자료소유자, 출처</caption>
                <colgroup>
                    <col style="width:160px;">
                    <col style="width:auto;">
                </colgroup>
                <tbody>
                    <tr>
                        <th scope="row">시험명</th>
                        <td>소핵시험 (in vivo)</td>
                    </tr>
                    <tr>
                        <th scope="row">생산연도</th>
                        <td>1994</td>
                    </tr>
                    <tr>
                        <th scope="row">GLP여부</th>
                        <td>Non-GLP</td>
                    </tr>
                    <tr>
                        <th scope="row">국/영문</th>
                        <td>국문</td>
                    </tr>
                    <tr>
                        <th scope="row">자료소유자</th>
                        <td>국립환경과학원</td>
                    </tr>
                    <tr>
                        <th scope="row" rowspan="2">출처</th>
                        <td>
                            합성화학물질의 안전성시험, 1994(환경부, 용역사업보고서)
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="td-foot">
                                <button type="button" class="btn btn-xsm btn-bg-blue-line">
                                    <span>정보보기</span>
                                    <svg class="ico-arrow-r" aria-hidden="true" focusable="false"><use href="../images/common/simbol.svg#ico-arrow-r"></use></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');
</script>  

</body>
</html>
