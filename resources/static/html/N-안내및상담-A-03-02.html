<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, target-densitydpi=medium-dpi, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>대국민</title>

<style type="text/css">

</style>

</head>
<body>

  <style> 
  .mail-form-wrap{display:flex;justify-content:center;padding:40px 20px;background:#fff;}
  .mail-form-layout{width:100%;max-width:600px;}
  .mail-form-title{margin:0 0 32px;font-size:23px;font-weight:700;line-height:1.5;color:#1d1d1d;word-break:keep-all;}
  .mail-form-card{display:flex;flex-direction:column;gap:24px;padding:32px;border:1px solid #dee2e6;border-radius:8px;}
  .mail-form-intro{display:flex;flex-direction:column;gap:8px;}
  .mail-form-greeting{margin:0;font-size:17px;font-weight:700;line-height:1.5;color:#212529;}
  .mail-form-desc p{margin:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;}
  .mail-form-summary{padding:24px;border-radius:8px;background:#f8f9fa;}
  .mail-form-summary-list{margin:0;display:flex;flex-direction:column;gap:16px;}
  .mail-form-summary-item{display:flex;gap:24px;align-items:flex-start;font-size:14px;line-height:1.5;}
  .mail-form-summary-item dt{flex-shrink:0;width:60px;margin:0;font-weight:700;color:#212529;}
  .mail-form-summary-item dd{flex:1;min-width:0;margin:0;color:#495057;word-break:break-word;}
  .mail-form-btn{display:inline-flex;align-items:center;justify-content:center;width:200px;height:44px;border-radius:6px;background:#0056d0;font-size:16px;line-height:1.5;color:#fff;text-decoration:none;}
  .mail-form-notice{margin:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;}

  </style>

    <div class="mail-form-wrap" style="background-attachment:scroll;display:flex;justify-content:center;padding-top:40px;padding-bottom:40px;padding-right:20px;padding-left:20px;background-color:#fff;background-image:none;background-repeat:repeat;background-position:top left;" >
        <div class="mail-form-layout" style="width:100%;max-width:600px;" >
            <p class="mail-form-title" style="margin-top:0;margin-bottom:32px;margin-right:0;margin-left:0;font-size:23px;font-weight:700;line-height:1.5;color:#1d1d1d;word-break:keep-all;" >[화학물질정보 공동활용 플랫폼] 문의하신 내용에 답변이 등록되었습니다.</p>
            <div class="mail-form-card" style="display:flex;flex-direction:column;gap:24px;padding-top:32px;padding-bottom:32px;padding-right:32px;padding-left:32px;border-width:1px;border-style:solid;border-color:#dee2e6;border-radius:8px;" >
                <div class="mail-form-intro" style="display:flex;flex-direction:column;gap:8px;" >
                    <p class="mail-form-greeting" style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:17px;font-weight:700;line-height:1.5;color:#212529;" >안녕하세요. 화학물질정보 공동활용 플랫폼입니다.</p>
                    <div class="mail-form-desc">
                        <p style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >접수해 주신 문의 사항에 대해 답변이 완료되어 안내드립니다.</p>
                        <p style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >아래 버튼을 클릭하시면 자세한 답변 내용을 확인하실 수 있습니다.</p>
                        <p style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >&nbsp;</p>
                        <p style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >추가로 궁금하신 점이 있다면 온라인 상담 게시판을 이용해 주세요.</p>
                        <p style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >감사합니다.</p>
                    </div>
                </div>
                <div class="mail-form-summary" style="background-attachment:scroll;padding-top:24px;padding-bottom:24px;padding-right:24px;padding-left:24px;border-radius:8px;background-color:#f8f9fa;background-image:none;background-repeat:repeat;background-position:top left;" >
                    <dl class="mail-form-summary-list" style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;display:flex;flex-direction:column;gap:16px;" >
                        <div class="mail-form-summary-item" style="display:flex;gap:24px;align-items:flex-start;font-size:14px;line-height:1.5;" >
                            <dt style="flex-shrink:0;width:60px;margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-weight:700;color:#212529;" >문의 제목</dt>
                            <dd style="flex:1;min-width:0;margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;color:#495057;word-break:break-word;" >{문의 제목}</dd>
                        </div>
                        <div class="mail-form-summary-item" style="display:flex;gap:24px;align-items:flex-start;font-size:14px;line-height:1.5;" >
                            <dt style="flex-shrink:0;width:60px;margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-weight:700;color:#212529;" >문의일</dt>
                            <dd style="flex:1;min-width:0;margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;color:#495057;word-break:break-word;" >{YYYY.MM.DD}</dd>
                        </div>
                    </dl>
                </div>
                <a href="javascript:void(0);" class="mail-form-btn" style="background-attachment:scroll;display:inline-flex;align-items:center;justify-content:center;width:200px;height:44px;border-radius:6px;background-color:#0056d0;background-image:none;background-repeat:repeat;background-position:top left;font-size:16px;line-height:1.5;color:#fff;text-decoration:none;" >문의 답변 확인하기</a>
                <p class="mail-form-notice" style="margin-top:0;margin-bottom:0;margin-right:0;margin-left:0;font-size:15px;line-height:1.5;color:#495057;word-break:keep-all;" >본 메일은 발신 전용으로 회신하실 경우 답변 되지 않습니다.</p>
            </div>
        </div>
    </div>

</body>
</html>
