<script>
var localData = [
    { no: 10, casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Ethyl acetate', echa: 'Y', omit: 23 },
    { no: 9,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Acetic acid; Glacial acetic acid', echa: 'Y', omit: 23 },
    { no: 8,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: "2,2'-[[3-Acetamido-4-[(2-chloro-4-nitrophenyl)azo]phenyl]imino]diethyl diacetate", echa: 'Y', omit: 23 },
    { no: 7,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: '2-(Acetyloxy)-1,2,3-propanetricarboxylic acid tributyl ester', echa: 'N', omit: 0 },
    { no: 6,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Acetic acid; Glacial acetic acid', echa: 'Y', omit: 23 },
    { no: 6,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Acetic acid; Glacial acetic acid', echa: 'Y', omit: 23 },
    { no: 6,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Acetic acid; Glacial acetic acid', echa: 'Y', omit: 23 },
    { no: 6,  casNo: '1259-478-55', uidExisting: '1259-478-55', name: 'Acetic acid; Glacial acetic acid', echa: 'Y', omit: 23 },
  ];

// ECHA / 생략사유서 셀 HTML 미리 가공
localData.forEach(function(r){
  r.echaCell = r.echa === 'Y'
    ? '<button type="button" class="btn-xsm btn-white"><span>ECHA</span></button>'
    : '-';
  r.omitCell = Number(r.omit) > 0
    ? '<button type="button" class="btn-xsm btn-bg-blue-line"><span>확인(' + r.omit + '개)</span></button>'
    : '-';
});

let gridConfig = {
    dataSource: localData,
    container: '#grid',
    width: '100%',
    rowHeight: 50,
    headerHeight: 50,
    height: '400px',
    showRowNo: false,
    // sortable: 'rotate',
    // filterable: true,
    pageable: {
       pageSizes: [10, 20, 30, 40, 50]
    },
    pagerBar: { left: 'pagerCombo', center: 'pager' },
    columns: [
      { field: 'no',          caption: '번호',               width: 60  },
      { field: 'casNo',       caption: 'CAS No',             width: 120 },
      { field: 'uidExisting', caption: '기존화학물질 고유번호', width: 150 },
      { field: 'name',        caption: '화학물질명',          width: 310, align: 'left' },
      {
        field: 'echaCell',
        caption: 'ECHA 등록여부',
        width: 130,
        cellTemplate: '{{{echaCell}}}'
      },
      {
        field: 'omitCell',
        caption: '생략사유서',
        width: 130,
        cellTemplate: '{{{omitCell}}}'
      },
    ],
  }

datagrid = SBGrid3.createGrid(gridConfig);
</script>
